<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<section id="login-screen" class="screen">
  <form id="login-form" class="surface login-card" autocomplete="off">
    <div class="brand-mark">
      <svg class="icon" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="5" rx="1.4"/><rect x="3" y="11" width="14" height="5" rx="1.4"/><circle cx="6.4" cy="6.5" r="0.6" fill="currentColor" stroke="none"/><circle cx="6.4" cy="13.5" r="0.6" fill="currentColor" stroke="none"/></svg>
    </div>
    <h1>Accès au panel</h1>
    <p class="muted">Entre le mot de passe du dashboard pour continuer.</p>
    <input id="password" type="password" name="dash-pass-field" placeholder="Mot de passe" autocomplete="new-password" required />
    <button type="submit" class="btn-primary">
      <span>Se connecter</span>
    </button>
    <p id="login-error" class="error" hidden></p>
  </form>
</section>

<section id="app-screen" class="screen" hidden>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg class="icon" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="5" rx="1.4"/><rect x="3" y="11" width="14" height="5" rx="1.4"/><circle cx="6.4" cy="6.5" r="0.6" fill="currentColor" stroke="none"/><circle cx="6.4" cy="13.5" r="0.6" fill="currentColor" stroke="none"/></svg>
      </div>
      <div>
        <h1>Serveurs</h1>
        <p class="muted" id="panel-host"></p>
      </div>
    </div>
    <div class="search-wrap">
      <svg class="icon" viewBox="0 0 20 20"><circle cx="9" cy="9" r="6"/><line x1="13.4" y1="13.4" x2="18" y2="18"/></svg>
      <input id="search" type="text" placeholder="Rechercher un serveur, un owner, un node…" />
    </div>
    <button id="logout" class="btn-ghost">
      <svg class="icon" viewBox="0 0 20 20"><path d="M8 17H5a1.5 1.5 0 0 1-1.5-1.5v-11A1.5 1.5 0 0 1 5 3h3"/><polyline points="13.5 14 17.5 10 13.5 6"/><line x1="17.5" y1="10" x2="7.5" y2="10"/></svg>
      <span>Déconnexion</span>
    </button>
  </header>

  <div class="stats-strip">
    <div class="stat surface">
      <div class="stat-icon tone-neutral">
        <svg class="icon" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="5" rx="1.4"/><rect x="3" y="11" width="14" height="5" rx="1.4"/></svg>
      </div>
      <div class="stat-text">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">Serveurs</span>
      </div>
    </div>
    <div class="stat surface">
      <div class="stat-icon tone-mint">
        <svg class="icon" viewBox="0 0 20 20"><path d="M7 4l9 6-9 6V4z" fill="currentColor" stroke="none"/></svg>
      </div>
      <div class="stat-text">
        <span class="stat-value" id="stat-active">0</span>
        <span class="stat-label">Actifs</span>
      </div>
    </div>
    <div class="stat surface">
      <div class="stat-icon tone-peach">
        <svg class="icon" viewBox="0 0 20 20"><rect x="6" y="4" width="3" height="12" rx="1"/><rect x="11" y="4" width="3" height="12" rx="1"/></svg>
      </div>
      <div class="stat-text">
        <span class="stat-value" id="stat-suspended">0</span>
        <span class="stat-label">Suspendus</span>
      </div>
    </div>
    <div class="stat surface">
      <div class="stat-icon tone-lavender">
        <svg class="icon" viewBox="0 0 20 20"><ellipse cx="10" cy="5" rx="7" ry="2.4"/><path d="M3 5v4c0 1.3 3.1 2.4 7 2.4s7-1.1 7-2.4V5"/><path d="M3 9v4c0 1.3 3.1 2.4 7 2.4s7-1.1 7-2.4V9"/></svg>
      </div>
      <div class="stat-text">
        <span class="stat-value" id="stat-nodes">0</span>
        <span class="stat-label">Nodes</span>
      </div>
    </div>
  </div>

  <div id="grid" class="grid"></div>
  <p id="empty-state" class="empty" hidden>Aucun serveur ne correspond à ta recherche.</p>
</section>

<div id="modal-layer" class="modal-layer" hidden>
  <div class="modal surface" id="modal"></div>
</div>

<div id="toast-layer" class="toast-layer"></div>

<script src="script.js"></script>
</body>
</html>
