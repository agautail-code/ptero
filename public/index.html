<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="ambient" aria-hidden="true">
  <span class="blob blob-a"></span>
  <span class="blob blob-b"></span>
  <span class="blob blob-c"></span>
  <div class="grain"></div>
</div>

<section id="login-screen" class="screen">
  <form id="login-form" class="glass login-card">
    <div class="login-mark">
      <span class="mark-block"></span>
      <span class="mark-block"></span>
      <span class="mark-block"></span>
    </div>
    <h1>Accès au panel</h1>
    <p class="muted">Entre le mot de passe du dashboard pour continuer.</p>
    <input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required />
    <button type="submit" class="btn-primary">
      <span>Se connecter</span>
    </button>
    <p id="login-error" class="error" hidden></p>
  </form>
</section>

<section id="app-screen" class="screen" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="mark-block small"></span>
      <div>
        <h1>Serveurs</h1>
        <p class="muted" id="panel-host"></p>
      </div>
    </div>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="Rechercher un serveur, un owner, un node…" />
    </div>
    <button id="logout" class="btn-ghost">Déconnexion</button>
  </header>

  <div class="stats-strip">
    <div class="stat glass">
      <span class="stat-value" id="stat-total">0</span>
      <span class="stat-label">Serveurs</span>
    </div>
    <div class="stat glass">
      <span class="stat-value accent-emerald" id="stat-active">0</span>
      <span class="stat-label">Actifs</span>
    </div>
    <div class="stat glass">
      <span class="stat-value accent-amber" id="stat-suspended">0</span>
      <span class="stat-label">Suspendus</span>
    </div>
    <div class="stat glass">
      <span class="stat-value accent-violet" id="stat-nodes">0</span>
      <span class="stat-label">Nodes</span>
    </div>
  </div>

  <div id="grid" class="grid"></div>
  <p id="empty-state" class="empty" hidden>Aucun serveur ne correspond à ta recherche.</p>
</section>

<div id="modal-layer" class="modal-layer" hidden>
  <div class="modal glass" id="modal"></div>
</div>

<div id="toast-layer" class="toast-layer"></div>

<script src="script.js"></script>
</body>
</html>
